<html lang="en" class="dark scroll-smooth">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Official website for AI Aaji with live Gemini Realtime voice demo, intelligent chatbot, download access, pricing, and contact-to-purchase." />
    <meta property="og:title" content="AI Aaji — Intelligent AI Personal Assistant" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Official website for AI Aaji with live Gemini Realtime voice demo, intelligent chatbot, download access, pricing, and contact-to-purchase." />
    <meta name="theme-color" content="#080B14" />
    <link rel="icon" type="image/svg+xml" href="/assets/ai_aaji_logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('ai_aaji_theme');
          if (savedTheme === 'editorial') {
            document.documentElement.setAttribute('data-theme', 'editorial');
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('editorial');
          } else {
            document.documentElement.setAttribute('data-theme', 'midnight');
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('editorial');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'midnight');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-main)] antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
